[package]
name = "concentrated"
version = "0.2.4"
edition = "2024"
authors = ["dnlzrgz <contact@dnlzrgz.com>"]
description = "another pomodoro app for the terminal."
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
etcetera = "0.11.0"
humantime = "2.4.0"
notify-rust = "4.18.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
tui-big-text = "0.8.10"

[profile.release]
opt-level = "s"
strip = true
lto = true
panic = "abort"
codegen-units = 1
