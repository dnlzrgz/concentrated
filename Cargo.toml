[package]
name = "concentrated"
version = "0.1.8"
edition = "2024"
authors = ["dnlzrgz <contact@dnlzrgz.com>"]
description = "another pomodoro app for the terminal."
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
humantime = "2.4.0"
notify-rust = "4.18.1"
ratatui = "0.30.2"
tui-big-text = "0.8.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
